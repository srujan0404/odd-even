replicaCount: 2

image:
  repository: ghcr.io/srujan0404/even-odd
  # set at deploy time to the git commit sha, never "latest"
  tag: ""
  pullPolicy: IfNotPresent

config:
  logLevel: INFO
  # feature flag, adds a "message" field to /check responses
  showMessage: "false"

tracing:
  enabled: false
  endpoint: http://jaeger.observability.svc.cluster.local:4318

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: nginx
  host: even-odd.localhost

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPU: 70

pdb:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  # namespaces that are allowed to call the app
  allowFrom:
    - ingress-nginx
    - monitoring

serviceMonitor:
  enabled: false

alerts:
  enabled: false

dashboard:
  enabled: false
